name: Release

# 推送 v* 标签（例如 v1.0.2）时测试并发布到 npm。
#
# 认证方式（二选一）：
# 1. 推荐：npm Trusted Publishing（OIDC）。在 npm 上把本仓库的 release.yml 配置为
#    devtrack 的受信任发布者后，无需任何令牌；npm 会自动生成 provenance。
# 2. 后备：仓库密钥 NPM_TOKEN。仅在 Trusted Publishing 不可用时使用。
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Trusted Publishing 与 provenance 都依赖 OIDC 令牌
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要完整历史，用于确认标签指向的提交在 main 上
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Node 22 自带的 npm 10 不支持 Trusted Publishing，升级到 npm 11
      - name: 升级 npm
        run: npm install -g npm@^11.20.0 && npm --version

      - name: 发布前检查
        env:
          TAG: ${{ github.ref_name }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::标签 $TAG 与 package.json 中的版本 v$VERSION 不一致"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::标签 $TAG 指向的提交不在 main 分支上"
            exit 1
          fi
          if [ -n "$NPM_TOKEN" ]; then
            echo "::notice::检测到 NPM_TOKEN：优先使用 Trusted Publishing，不可用时以 NPM_TOKEN 作为后备"
          else
            echo "::notice::未配置 NPM_TOKEN：将使用 Trusted Publishing（需要已在 npm 上配置受信任发布者）"
          fi

      # 所有依赖都不需要安装脚本，与 CI 保持一致
      - run: npm ci --ignore-scripts

      - name: 类型检查
        run: npm run typecheck

      - name: 测试
        run: npm test

      - name: 发布到 npm
        env:
          # 未配置时为空；npm 会先尝试 OIDC（Trusted Publishing），成功后覆盖此令牌
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # 预发布版本（例如 1.1.0-beta.1）发布到 next 标签，不影响 latest
          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac

          # npm 的 OIDC（Trusted Publishing）失败时不会报错，而是静默改用 NODE_AUTH_TOKEN，
          # 原因只在 verbose 日志里。完整日志留在 runner 上，这里只显示常规输出和 oidc 相关的行。
          LOG="$RUNNER_TEMP/npm-publish.log"
          STATUS=0
          npm publish --provenance --access public --tag "$DIST_TAG" --loglevel verbose > "$LOG" 2>&1 || STATUS=$?
          grep -vE '^npm (verbose|http|timing|silly) ' "$LOG" || true
          OIDC=$(grep -E '^npm (verbose|silly) oidc ' "$LOG" | sed -E 's/^npm (verbose|silly) oidc //' | tr '\n' ';' | sed 's/;$//' || true)
          echo "OIDC：${OIDC:-（无日志）}"

          HINT="请核对 npm 上 devtrack 的受信任发布者：GitHub Actions / sp1128 / DevTrack / release.yml / Environment 留空"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::发布失败。Trusted Publishing：${OIDC:-无日志}。$HINT"
            echo "❌ 发布失败（Trusted Publishing：${OIDC:-无日志}）" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif grep -q 'oidc Successfully retrieved and set token' "$LOG"; then
            echo "::notice::已通过 Trusted Publishing（OIDC）认证发布"
            echo "✅ 认证方式：Trusted Publishing（OIDC）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Trusted Publishing 未生效，已改用 NPM_TOKEN 发布。npm 返回：${OIDC:-无日志}。$HINT"
            echo "⚠️ 认证方式：NPM_TOKEN（Trusted Publishing 未生效：${OIDC:-无日志}）" >> "$GITHUB_STEP_SUMMARY"
          fi
